services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: hello:latest
    ports:
      - "${APP_PORT:-80}:4380"
    environment:
      PORT: "4380"
      TZ: "Europe/Istanbul"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4380/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  notfound:
    build:
      context: .
      dockerfile: notfound/Dockerfile
    image: hello-notfound:latest
    ports:
      - "${NOTFOUND_PORT:-4381}:4381"
    environment:
      PORT: "4381"
      TZ: "Europe/Istanbul"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4381/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
